spring.application.name=bluestars
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.schemas=efikas
spring.flyway.default-schema=efikas
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

jwt.secret=${EFIKAS_JWT_SECRET}
jwt.token.validity=86400000

aws.region=${EFIKAS_AWS_REGION:auto}
aws.endpoint=${EFIKAS_AWS_ENDPOINT}
aws.path-style-access-enabled=${EFIKAS_AWS_PATH_STYLE_ACCESS_ENABLED:true}
aws.credentials.access-key-id=${EFIKAS_AWS_ACCESS_KEY_ID}
aws.credentials.secret-access-key=${EFIKAS_AWS_SECRET_ACCESS_KEY}
aws.bucket-name=${EFIKAS_AWS_BUCKET}

efikas.bootstrap.manager.enabled=${EFIKAS_BOOTSTRAP_MANAGER_ENABLED:false}
efikas.bootstrap.manager.email=${EFIKAS_BOOTSTRAP_MANAGER_EMAIL:}
efikas.bootstrap.manager.password=${EFIKAS_BOOTSTRAP_MANAGER_PASSWORD:}
efikas.bootstrap.manager.name=${EFIKAS_BOOTSTRAP_MANAGER_NAME:}
efikas.bootstrap.manager.surname=${EFIKAS_BOOTSTRAP_MANAGER_SURNAME:}
efikas.bootstrap.manager.jmbg=${EFIKAS_BOOTSTRAP_MANAGER_JMBG:}
efikas.bootstrap.manager.address=${EFIKAS_BOOTSTRAP_MANAGER_ADDRESS:}
efikas.bootstrap.manager.phone-number=${EFIKAS_BOOTSTRAP_MANAGER_PHONE:}

efikas.cors.allowed-origins=${EFIKAS_CORS_ALLOWED_ORIGINS:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

email.sender=${EFIKAS_EMAIL_SENDER:no-reply@localhost.invalid}
expo.api.url=https://exp.host/--/api/v2/push/send
oauth2.client.registration.google.client-id=${EFIKAS_GOOGLE_CLIENT_ID:local-placeholder}
