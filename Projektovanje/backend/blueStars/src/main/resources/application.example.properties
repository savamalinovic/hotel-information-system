# Copy to application-local.properties (ignored by Git).
# Run with: ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
spring.application.name=bluestars
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:efikas}
spring.datasource.username=${POSTGRES_USER:efikas}
spring.datasource.password=${POSTGRES_PASSWORD:efikas_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.schemas=efikas
spring.flyway.default-schema=efikas
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# One multipart request contains one attachment of at most 10 MB plus form overhead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

jwt.secret=${BLUESTARS_JWT_SECRET:local-development-jwt-secret-change-before-sharing}
jwt.token.validity=86400000

aws.region=${BLUESTARS_AWS_REGION:eu-central-1}
aws.endpoint=${BLUESTARS_AWS_ENDPOINT:}
aws.path-style-access-enabled=${BLUESTARS_AWS_PATH_STYLE_ACCESS_ENABLED:false}
aws.credentials.access-key-id=${BLUESTARS_AWS_ACCESS_KEY_ID:local-placeholder}
aws.credentials.secret-access-key=${BLUESTARS_AWS_SECRET_ACCESS_KEY:local-placeholder}
aws.bucket-name=${BLUESTARS_AWS_BUCKET:local-placeholder}

ses.enabled=${BLUESTARS_SES_ENABLED:false}
ses.region=${BLUESTARS_SES_REGION:eu-central-1}
ses.credentials.access-key-id=${BLUESTARS_SES_ACCESS_KEY_ID:local-placeholder}
ses.credentials.secret-access-key=${BLUESTARS_SES_SECRET_ACCESS_KEY:local-placeholder}

email.sender=${BLUESTARS_EMAIL_SENDER:no-reply@localhost.invalid}
expo.api.url=https://exp.host/--/api/v2/push/send
oauth2.client.registration.google.client-id=${BLUESTARS_GOOGLE_CLIENT_ID:local-placeholder}

# Optional one-time bootstrap for a fresh database. Disable after the first manager is created.
efikas.bootstrap.manager.enabled=${BLUESTARS_BOOTSTRAP_MANAGER_ENABLED:false}
efikas.bootstrap.manager.email=${BLUESTARS_BOOTSTRAP_MANAGER_EMAIL:}
efikas.bootstrap.manager.password=${BLUESTARS_BOOTSTRAP_MANAGER_PASSWORD:}
efikas.bootstrap.manager.name=${BLUESTARS_BOOTSTRAP_MANAGER_NAME:}
efikas.bootstrap.manager.surname=${BLUESTARS_BOOTSTRAP_MANAGER_SURNAME:}
efikas.bootstrap.manager.jmbg=${BLUESTARS_BOOTSTRAP_MANAGER_JMBG:}
efikas.bootstrap.manager.address=${BLUESTARS_BOOTSTRAP_MANAGER_ADDRESS:}
efikas.bootstrap.manager.phone-number=${BLUESTARS_BOOTSTRAP_MANAGER_PHONE:}
