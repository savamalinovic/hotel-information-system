# Copy to application-local.properties (ignored by Git).
# Run with: ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
spring.application.name=bluestars
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:efikas}
spring.datasource.username=${POSTGRES_USER:efikas}
spring.datasource.password=${POSTGRES_PASSWORD:efikas_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.schemas=efikas
spring.flyway.default-schema=efikas
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# One multipart request contains one attachment of at most 10 MB plus form overhead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

jwt.secret=${EFIKAS_JWT_SECRET:local-development-jwt-secret-change-before-sharing}
jwt.token.validity=86400000

aws.region=${EFIKAS_AWS_REGION:eu-central-1}
aws.endpoint=${EFIKAS_AWS_ENDPOINT:}
aws.path-style-access-enabled=${EFIKAS_AWS_PATH_STYLE_ACCESS_ENABLED:false}
aws.credentials.access-key-id=${EFIKAS_AWS_ACCESS_KEY_ID:local-placeholder}
aws.credentials.secret-access-key=${EFIKAS_AWS_SECRET_ACCESS_KEY:local-placeholder}
aws.bucket-name=${EFIKAS_AWS_BUCKET:local-placeholder}

email.sender=${EFIKAS_EMAIL_SENDER:no-reply@localhost.invalid}
expo.api.url=https://exp.host/--/api/v2/push/send
oauth2.client.registration.google.client-id=${EFIKAS_GOOGLE_CLIENT_ID:local-placeholder}

# Optional one-time bootstrap for a fresh database. Disable after the first manager is created.
efikas.bootstrap.manager.enabled=${EFIKAS_BOOTSTRAP_MANAGER_ENABLED:false}
efikas.bootstrap.manager.email=${EFIKAS_BOOTSTRAP_MANAGER_EMAIL:}
efikas.bootstrap.manager.password=${EFIKAS_BOOTSTRAP_MANAGER_PASSWORD:}
efikas.bootstrap.manager.name=${EFIKAS_BOOTSTRAP_MANAGER_NAME:}
efikas.bootstrap.manager.surname=${EFIKAS_BOOTSTRAP_MANAGER_SURNAME:}
efikas.bootstrap.manager.jmbg=${EFIKAS_BOOTSTRAP_MANAGER_JMBG:}
efikas.bootstrap.manager.address=${EFIKAS_BOOTSTRAP_MANAGER_ADDRESS:}
efikas.bootstrap.manager.phone-number=${EFIKAS_BOOTSTRAP_MANAGER_PHONE:}
