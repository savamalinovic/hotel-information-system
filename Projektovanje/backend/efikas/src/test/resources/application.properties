spring.application.name=efikas-test
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TEST_DB:efikas_test}
spring.datasource.username=${POSTGRES_USER:efikas}
spring.datasource.password=${POSTGRES_PASSWORD:efikas_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

jwt.secret=${EFIKAS_JWT_SECRET:local-test-jwt-secret-that-is-not-for-production}
jwt.token.validity=86400000

aws.region=${EFIKAS_AWS_REGION:eu-central-1}
aws.credentials.access-key-id=${EFIKAS_AWS_ACCESS_KEY_ID:local-placeholder}
aws.credentials.secret-access-key=${EFIKAS_AWS_SECRET_ACCESS_KEY:local-placeholder}
aws.bucket-name=${EFIKAS_AWS_BUCKET:local-placeholder}

email.sender=${EFIKAS_EMAIL_SENDER:no-reply@localhost.invalid}
expo.api.url=https://exp.host/--/api/v2/push/send
oauth2.client.registration.google.client-id=${EFIKAS_GOOGLE_CLIENT_ID:local-placeholder}
